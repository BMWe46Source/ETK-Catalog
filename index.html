<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETK Mobile Parts Catalogue</title>
    <style>
        :root {
            --primary: #006699;
            --bg: #f4f4f9;
            --card-bg: #fff;
            --text: #333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            background: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        input, button {
            padding: 12px;
            font-size: 16px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        input {
            width: calc(100% - 28px);
            max-width: 500px;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            opacity: 0.9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>ETK Mini Catalogue Viewer</h2>
        <p>Quick lookup for vehicle assemblies & OEM part numbers</p>
    </header>

    <div class="card">
        <h3>Vehicle Identification</h3>
        <label for="vinInput">Enter 17-Digit VIN or Select Model:</label><br>
        <input type="text" id="vinInput" placeholder="e.g., WBA... or Chassis Code"><br>
        <button onclick="loadCatalog()">Load Assemblies</button>
    </div>

    <div class="card" id="catalogResults" style="display:none;">
        <h3>Parts Assembly Group</h3>
        <p><strong>Vehicle Detected:</strong> <span id="vehicleInfo"></span></p>
        
        <table>
            <thead>
                <tr>
                    <th>Pos</th>
                    <th>Description</th>
                    <th>Part Number</th>
                    <th>Qty</th>
                </tr>
            </thead>
            <tbody id="partsTableBody">
                <!-- Dynamically populated rows -->
            </tbody>
        </table>
    </div>
</div>

<script>
    function loadCatalog() {
        const vin = document.getElementById('vinInput').value;
        if(!vin) {
            alert('Please enter a VIN or model code.');
            return;
        }

        // Mock database response for demonstration
        document.getElementById('vehicleInfo').innerText = "Sample Chassis (" + vin.toUpperCase() + ")";
        const mockParts = [
            { pos: "01", name: "Front Brake Pad Set", partNo: "34-11-6-888-297", qty: "1" },
            { pos: "02", name: "Brake Disc Ventilated", partNo: "34-11-6-792-225", qty: "2" },
            { pos: "03", name: "Sensor, brake pad wear", partNo: "34-35-6-792-567", qty: "1" },
            { pos: "04", name: "Repairs kit guide frame", partNo: "34-11-6-850-939", qty: "2" }
        ];

        const tbody = document.getElementById('partsTableBody');
        tbody.innerHTML = "";
        
        mockParts.forEach(item => {
            let row = `<tr>
                <td>${item.pos}</td>
                <td>${item.name}</td>
                <td><code>${item.partNo}</code></td>
                <td>${item.qty}</td>
            </tr>`;
            tbody.innerHTML += row;
        });

        document.getElementById('catalogResults').style.display = "block";
    }
</script>

</body>
</html>
